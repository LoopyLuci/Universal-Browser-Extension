[workspace]
resolver = "2"
members = [
    "crates/dnea-core",
    "crates/dnea-config",
    "crates/dnea-abi",
    "crates/dnea-manifest",
    "crates/dnea-module-host",
    "crates/dnea-nm-host",
    "crates/dnea-session",
    "crates/dnea-local-api",
    "crates/dnea-companion-web",
    "crates/dnea-daemon",
    "crates/dnea-cli",
    "crates/focus-mode",
]

[workspace.package]
version      = "1.0.0"
edition      = "2021"
rust-version = "1.85"
license      = "Apache-2.0"
repository   = "https://github.com/LoopyLuci/Universal-Browser-Extension"
authors      = ["DNEA Project Contributors"]

[workspace.dependencies]
# Async
tokio            = { version = "1.40", features = ["rt-multi-thread", "macros", "process", "fs", "signal", "sync", "time", "net", "io-util"] }
tokio-util       = { version = "0.7",  features = ["codec"] }
futures          = "0.3"
async-trait      = "0.1"

# Serialization
serde            = { version = "1", features = ["derive", "rc"] }
serde_json       = "1"
toml             = "0.8"

# Errors
thiserror        = "1"
anyhow           = "1"

# Identifiers and time
uuid             = { version = "1.10", features = ["v7", "serde"] }
time             = { version = "0.3",  features = ["serde-well-known", "formatting", "parsing"] }

# Crypto
sha2             = "0.10"
base64           = "0.22"
ed25519-dalek    = { version = "2.1", features = ["pkcs8", "rand_core"] }
rand             = "0.8"

# Wasm
wasmtime         = { version = "18", features = ["component-model", "async", "cranelift", "pooling-allocator"] }
wasmtime-wasi    = "18"
wit-bindgen      = "0.30"

# Storage
rusqlite         = { version = "0.32", features = ["bundled", "backup", "serde_json"] }
deadpool-sqlite  = "0.8"

# HTTP / WS
axum             = { version = "0.7", features = ["ws", "macros", "json"] }
tower            = "0.5"
tower-http       = { version = "0.6", features = ["trace", "limit", "compression-zstd"] }
hyper            = "1"
hmac             = "0.12"
jsonwebtoken     = "9"
reqwest          = { version = "0.12", features = ["json", "rustls-tls"] }

# Validation
jsonschema       = { version = "0.20", features = ["resolve-http"] }

# CLI
clap             = { version = "4.5", features = ["derive", "env", "wrap_help"] }

# Observability
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter", "json", "time"] }

# Platform
directories      = "5"
libc             = "0.2"

# Concurrency
dashmap          = "6"
parking_lot      = "0.12"
bytes            = "1"
once_cell        = "1"
regex            = "1"
indexmap         = { version = "2", features = ["serde"] }

# Dev / test
proptest         = "1"
insta            = "1"
tempfile         = "3"
libfuzzer-sys    = "0.4"

[profile.release]
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
opt-level     = 3

[profile.dev]
opt-level = 1