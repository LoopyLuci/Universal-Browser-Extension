[[op]]
id = "dnea_thin_client.dev"
kind = "cmd"
summary = "`npm run dev`: wxt"
argv = ["npm", "run", "dev"]
cwd = "thin-client"
timeout_s = 86400
background = true
extra_args = true

[[op]]
id = "dnea_thin_client.build"
kind = "cmd"
summary = "`npm run build`: wxt build"
argv = ["npm", "run", "build"]
cwd = "thin-client"
timeout_s = 3600
background = true
extra_args = true

