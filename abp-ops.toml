# What this project can do, as ABP operations (abp_modkit). Edit freely: adopting it again
# (`python -m abp_modkit adopt .`) keeps edited summaries, settings and ops you added, and picks up new
# routes and commands.

[service]
id = "universal-browser-extension"
name = "Universal Browser Extension"
description = "One install. Every browser. Capability-enforced at the Wasm boundary."

[[op]]
id = "dnea_nm_bridge.run"
kind = "cmd"
summary = "Run `dnea-nm-bridge` with the given arguments"
argv = ["{target}/release/dnea-nm-bridge{exe}"]
timeout_s = 600
extra_args = true

[[op]]
id = "bridge.run"
kind = "cmd"
summary = "Run `bridge` with the given arguments"
argv = ["{target}/release/bridge{exe}"]
timeout_s = 600
extra_args = true

[[op]]
id = "dnea_daemon.run"
kind = "cmd"
summary = "Run `dnea-daemon` with the given arguments"
argv = ["{target}/release/dnea-daemon{exe}"]
