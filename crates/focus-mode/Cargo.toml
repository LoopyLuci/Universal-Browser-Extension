[package]
name = "focus-mode"
version = "1.2.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow      = "1"
wit-bindgen = { workspace = true }

[package.metadata.component]
package = "dnea:focus-mode"

[package.metadata.component.target]
path = "../../wit"
world = "module"
